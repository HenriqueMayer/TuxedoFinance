name: Docker

# Builds the image and starts it. A published release also pushes the tested
# image for both architectures. Every pull request runs it, because the rule
# of the branches `main` and `develop` requires the two jobs by their names.
on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event_name == 'release' && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Read the version of the backend
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: The release tag names the version and is on main
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          test "$RELEASE_TAG" = "v$VERSION"
          git merge-base --is-ancestor HEAD origin/main
      - name: Build the image
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: docker build --build-arg VERSION="$VERSION" --build-arg REVISION="$(git rev-parse HEAD)" --tag tuxedo-finance:test .
      - name: Start the container and wait for it to be healthy
        run: |
          docker run --detach --name tuxedo --env SECRET_KEY=ci-only-not-a-real-secret \
            --publish 127.0.0.1:8000:8000 tuxedo-finance:test
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' tuxedo)
            test "$status" = healthy && break
            sleep 3
          done
          docker logs tuxedo
          test "$status" = healthy
      - name: The API answers and the client is served
        run: |
          curl --fail --silent http://127.0.0.1:8000/api/health | grep --quiet '"status": "ok"'
          curl --fail --silent http://127.0.0.1:8000/ | grep --quiet '<div id="root">'
          curl --fail --silent http://127.0.0.1:8000/transactions | grep --quiet '<div id="root">'
      - name: The data survives a restart
        run: |
          docker restart tuxedo
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/api/health && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/api/health | grep --quiet '"status": "ok"'
      - name: Save the tested release image
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: docker save tuxedo-finance:test | gzip > "$RUNNER_TEMP/image.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'release' && !github.event.release.prerelease
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 2

  publish:
    name: Publish the tested release
    needs: validate
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested images and their manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for arch in amd64 arm64; do
            gzip -dc "$RUNNER_TEMP/images/image-$arch/image.tar.gz" | docker load
            docker tag tuxedo-finance:test "$image:$RELEASE_TAG-$arch"
            docker push "$image:$RELEASE_TAG-$arch"
          done
          # A versioned image is the supported interface; there is no moving latest tag.
          docker buildx imagetools create --tag "$image:$RELEASE_TAG" \
            "$image:$RELEASE_TAG-amd64" "$image:$RELEASE_TAG-arm64"
      - name: Attach the installation files of this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sed "s|REPLACE_WITH_RELEASE_TAG|$RELEASE_TAG|; s|ghcr.io/henriquemayer/tuxedofinance|ghcr.io/${GITHUB_REPOSITORY,,}|" \
            .env.docker.example > docker.env.example
          gh release upload "$RELEASE_TAG" compose.yaml docker.env.example --clobber
