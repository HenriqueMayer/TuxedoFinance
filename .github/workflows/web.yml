name: Web

# The client depends on the API schema and the journeys run the real backend,
# so a backend change also runs this workflow.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "web/**"
      - "backend/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - name: API types match the backend schema
        run: |
          npm run api:types
          git diff --exit-code -- src/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  journeys:
    name: Browser journeys
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: npm run journeys
      - name: Upload the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-report
          path: web/var/journeys/
          if-no-files-found: ignore
