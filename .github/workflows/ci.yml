name: CI

# The checks of the application. Every pull request runs them, because the
# rule of the branches `main` and `develop` requires the last job by its name.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      TUXEDO_ENV_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Translations are compiled
        run: |
          sudo apt-get update && sudo apt-get install --no-install-recommends -y gettext
          uv run python manage.py compilemessages --ignore=.venv
          git diff --exit-code -- locale
      - name: Django system check and migration drift
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
      # The limit is two points under the measured value. The uncovered code is
      # mostly 1.x rules without a screen: points bought with money, IOF on a
      # redemption, invoice credits.
      - name: Tests with branch coverage
        run: |
          uv run coverage run manage.py test
          uv run coverage report --fail-under=84

  web:
    name: Types, lint, unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - name: API types match the backend schema
        run: |
          npm run api:types
          git diff --exit-code -- src/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  journeys:
    name: Browser journeys
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: npm run journeys
      - name: Upload the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-report
          path: web/var/journeys/
          if-no-files-found: ignore

  # A required check that was skipped counts as passed. This job always runs
  # and fails when a job before it did not pass.
  required:
    name: Application and tooling checks
    if: always()
    needs: [backend, web, journeys]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            test "$result" = success
          done
