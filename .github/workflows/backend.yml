name: Backend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      TUXEDO_ENV_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Translations are compiled
        run: |
          sudo apt-get update && sudo apt-get install --no-install-recommends -y gettext
          uv run python manage.py compilemessages --ignore=.venv
          git diff --exit-code -- locale
      - name: Django system check and migration drift
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
      # The limit is the measured value of the moved domain, whose 1.x tests ran
      # through views. Raise it as each part adds API tests for its modules.
      - name: Tests with branch coverage
        run: |
          uv run coverage run manage.py test
          uv run coverage report --fail-under=65
