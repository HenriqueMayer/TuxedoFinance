{% load i18n %}
<div data-variable-row class="grid items-end gap-3 border-b border-forest/10 py-4 dark:border-cream/10 sm:grid-cols-[minmax(0,1fr)_minmax(9rem,0.65fr)_auto]">
    <label>
        <span class="field-label">{% translate "Description" %}</span>
        <input aria-label="{% translate 'Fixed expense description' %}" class="entry-input mt-2 w-full" type="text" name="variable_label" maxlength="80" value="{{ row.label|default:'' }}" placeholder="{% translate 'E.g. rent' %}">
    </label>
    <div>
        <span class="field-label">{% translate "Monthly amount" %}</span>
        <div class="mt-2 grid grid-cols-[4rem_minmax(0,1fr)] items-center gap-2">
            <select name="variable_type" aria-label="{% translate 'Fixed expense unit' %}" class="entry-input">
                <option value="currency" {% if row.value_type != 'percent' %}selected{% endif %}>R$</option>
                <option value="percent" {% if row.value_type == 'percent' %}selected{% endif %}>%</option>
            </select>
            <input aria-label="{% translate 'Fixed expense monthly amount' %}" class="entry-input min-w-0 w-full tabular-nums" type="text" inputmode="decimal" name="variable_value" min="0" step="0.01" value="{{ row.value|default:'' }}" placeholder="0.00">
        </div>
    </div>
    <button type="submit" name="action" value="remove_variable_{{ row_index }}" data-remove-variable class="icon-action icon-action--danger" aria-label="{% translate 'Remove fixed expense' %}">×</button>
</div>
