{% load i18n %}
<tr data-variable-row class="border-b border-forest/10 dark:border-cream/10">
    <td class="px-2 py-3"><input aria-label="{% translate 'Expense description' %}" aria-describedby="variable-label-help" class="w-full rounded-xl border border-forest/20 bg-white px-3 py-2 text-sm text-forest focus:border-caramel focus:outline-none focus:ring-2 focus:ring-caramel/30 dark:border-cream/20 dark:bg-night dark:text-cream" type="text" name="variable_label" maxlength="80" value="{{ row.label|default:'' }}" placeholder="{% translate 'E.g. leisure' %}"></td>
    <td class="px-2 py-3"><select aria-label="{% translate 'Expense type' %}" aria-describedby="variable-type-help" class="w-full rounded-xl border border-forest/20 bg-white px-3 py-2 text-sm text-forest focus:border-caramel focus:outline-none focus:ring-2 focus:ring-caramel/30 dark:border-cream/20 dark:bg-night dark:text-cream" name="variable_type"><option value="currency"{% if row.value_type != 'percent' %} selected{% endif %}>R$</option><option value="percent"{% if row.value_type == 'percent' %} selected{% endif %}>%</option></select></td>
    <td class="px-2 py-3"><input aria-label="{% translate 'Expense value' %}" aria-describedby="variable-value-help" class="w-full rounded-xl border border-forest/20 bg-white px-3 py-2 text-sm tabular-nums text-forest focus:border-caramel focus:outline-none focus:ring-2 focus:ring-caramel/30 dark:border-cream/20 dark:bg-night dark:text-cream" type="number" name="variable_value" min="0" step="0.01" value="{{ row.value|default:'' }}" placeholder="0.00"></td>
    <td class="px-2 py-3 text-right"><button type="button" data-remove-variable class="rounded-full p-2 text-forest/60 hover:bg-expense/10 hover:text-expense focus:outline-none focus:ring-2 focus:ring-caramel dark:text-cream/60 dark:hover:text-expense-light" aria-label="{% translate 'Remove expense' %}">×</button></td>
</tr>
