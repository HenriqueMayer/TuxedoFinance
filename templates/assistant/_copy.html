{% load i18n %}
<div class="assistant-copy-control">
    <a class="assistant-copy-action" href="{{ export_url }}" download hx-boost="false" data-assistant-copy aria-label="{{ copy_label }}" title="{{ copy_label }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>{% if copy_label_visible %}<span>{{ copy_label }}</span>{% endif %}</a>
    <span class="assistant-copy-status" role="status" aria-live="polite" data-assistant-copy-status></span>
    <a class="quiet-action assistant-copy-download" href="{{ export_url }}" download hx-boost="false" data-assistant-copy-download hidden>{% translate 'Download Markdown' %}</a>
</div>
