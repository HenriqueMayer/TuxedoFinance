{% load i18n %}
{% if APP_SECTIONS|length > 1 %}
<nav class="section-nav mb-6{% if request.resolver_match.namespace == 'banking' %} banking-sections{% endif %}" aria-label="{{ APP_SECTION_LABEL }}">
    {% for section in APP_SECTIONS %}
    <a href="{{ section.url }}"{% if section.active %} aria-current="page"{% endif %}>{{ section.label }}</a>
    {% endfor %}
</nav>
{% elif request.resolver_match.namespace == 'planning' or request.resolver_match.namespace == 'sandbox' %}
{% include 'planning/_navigation.html' %}
{% endif %}
