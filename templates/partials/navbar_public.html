{% comment %}
Public navbar (PRD §9.6): logo (gradient) on the left, Log in / Sign up on
the right. Included automatically by base.html for anonymous visitors —
never include this directly in a page template.
{% endcomment %}
<header class="sticky top-0 z-40 border-b border-slate-800 bg-slate-950/80 backdrop-blur">
    <nav class="mx-auto flex h-16 w-full max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
        <a href="{% url 'pages:landing' %}" class="flex items-center gap-2 text-lg font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-950 rounded-lg">
            <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-r from-indigo-500 via-violet-500 to-fuchsia-500 text-sm font-bold text-white">
                CF
            </span>
            <span class="bg-gradient-to-r from-indigo-400 via-violet-400 to-fuchsia-400 bg-clip-text text-transparent">
                CashFlow
            </span>
        </a>

        <div class="flex items-center gap-2 sm:gap-3">
            <a href="{% url 'accounts:login' %}"
               class="inline-flex items-center gap-2 rounded-xl border border-slate-700 bg-slate-900/60 px-4 py-2.5 text-sm font-medium text-slate-200 transition hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-950">
                Log in
            </a>
            <a href="{% url 'accounts:signup' %}"
               class="inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-indigo-500 via-violet-500 to-fuchsia-500 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-indigo-500/20 transition hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-950">
                Sign up
            </a>
        </div>
    </nav>
</header>
