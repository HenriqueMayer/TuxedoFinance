<a id="app-{{ nav_variant }}-{{ item.key }}-link" href="{{ item.url }}" data-nav-item="{{ item.key }}" class="app-navigation-link" aria-label="{{ item.label }}"{% if item.active %} aria-current="page"{% endif %}>
    {% include 'partials/navigation_icon.html' with area=item.key %}
    <span class="app-navigation-label">{% if nav_variant == 'mobile' %}{{ item.mobile_label }}{% else %}{{ item.label }}{% endif %}</span>
</a>
