{% firstof field_help_text field.help_text as contextual_help %}
<div class="label-with-help">
    <label for="{{ field.id_for_label }}" class="field-label">
        {{ field.label }}{% if field.field.required %} <span class="text-expense dark:text-expense-light">*</span>{% endif %}
    </label>
    {% if contextual_help or field_help_template %}
        {% include 'partials/help_popover.html' with help_id=field.id_for_label|add:'-help' help_label=field.label help_text=contextual_help help_template=field_help_template only %}
    {% endif %}
</div>
