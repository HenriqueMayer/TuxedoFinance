{% load i18n form_ui %}
<div class="space-y-2" data-form-field data-preferred-date-field{% if field.field.widget.entry_calendar %} data-entry-date{% endif %} data-date-order="{% if USER_DATE_FORMAT == 'm/d/Y' %}MDY{% else %}DMY{% endif %}">
    {% include 'partials/field_label.html' %}
    <div class="flex gap-2">
        <div class="min-w-0 flex-1">{% form_control field %}</div>
        <button type="button" class="icon-action" data-open-date-picker hidden>
            <span>{% translate "Select date" %}</span>
            {% if field.field.widget.entry_calendar %}<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-11 4h3"/></svg>{% endif %}
        </button>
        <input type="date" class="sr-only" tabindex="-1" aria-hidden="true" data-native-date-picker>
    </div>
    {% for error in field.errors %}<p id="{{ field.id_for_label }}-error-{{ forloop.counter }}" role="alert" data-field-error class="text-sm text-expense dark:text-expense-light">{{ error }}</p>{% endfor %}
</div>
