{% load i18n %}
<div class="space-y-2" data-preferred-date-field data-date-order="{% if USER_DATE_FORMAT == 'm/d/Y' %}MDY{% else %}DMY{% endif %}">
    <label for="{{ field.id_for_label }}" class="block text-xs uppercase tracking-widest font-medium text-forest/70 dark:text-cream/70">
        {{ field.label }}{% if field.field.required %} <span class="text-terracotta">*</span>{% endif %}
    </label>
    <div class="flex gap-2">
        <div class="min-w-0 flex-1">{{ field }}</div>
        <button type="button" class="shrink-0 rounded-xl border border-forest/20 px-4 text-xs uppercase tracking-widest font-medium transition-colors hover:bg-forest hover:text-cream dark:border-cream/20 dark:hover:bg-cream dark:hover:text-forest" data-open-date-picker>
            {% translate "Select date" %}
        </button>
        <input type="date" class="sr-only" tabindex="-1" aria-hidden="true" data-native-date-picker>
    </div>
    {% if field.help_text %}<p id="{{ field.id_for_label }}-help" class="text-sm font-normal text-forest/70 dark:text-cream/70">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p id="{{ field.id_for_label }}-error-{{ forloop.counter }}" role="alert" class="text-sm text-terracotta dark:text-terracotta-light">{{ error }}</p>{% endfor %}
</div>
