{% load i18n form_ui %}
<div class="space-y-2" data-preferred-date-field data-date-order="{% if USER_DATE_FORMAT == 'm/d/Y' %}MDY{% else %}DMY{% endif %}">
    {% include 'partials/field_label.html' %}
    <div class="flex gap-2">
        <div class="min-w-0 flex-1">{% form_control field %}</div>
        <button type="button" class="shrink-0 rounded-xl border border-forest/20 px-4 text-xs uppercase tracking-widest font-medium transition-colors hover:bg-forest hover:text-cream dark:border-cream/20 dark:hover:bg-cream dark:hover:text-night" data-open-date-picker hidden>
            {% translate "Select date" %}
        </button>
        <input type="date" class="sr-only" tabindex="-1" aria-hidden="true" data-native-date-picker>
    </div>
    {% for error in field.errors %}<p id="{{ field.id_for_label }}-error-{{ forloop.counter }}" role="alert" data-field-error class="text-sm text-expense dark:text-expense-light">{{ error }}</p>{% endfor %}
</div>
