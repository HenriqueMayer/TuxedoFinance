{% load i18n %}
<span class="help-popover" data-help-popover>
    <button type="button" class="help-trigger" data-help-trigger hidden
            aria-label="{% blocktranslate with label=help_label %}Explain {{ label }}{% endblocktranslate %}"
            aria-describedby="{{ help_id }}" aria-controls="{{ help_id }}" aria-expanded="false">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="9"></circle>
            <path stroke-linecap="round" d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.75-2.5 1.75-2.5 3.5M12 16h.01"></path>
        </svg>
    </button>
    <span id="{{ help_id }}" class="help-content" data-help-content role="tooltip" hidden>
        {% include 'partials/help_content.html' %}
    </span>
    <noscript>
        <details class="help-fallback">
            <summary class="help-trigger" aria-label="{% blocktranslate with label=help_label %}Explain {{ label }}{% endblocktranslate %}">?</summary>
            <span class="help-fallback-content">{% include 'partials/help_content.html' %}</span>
        </details>
    </noscript>
</span>
