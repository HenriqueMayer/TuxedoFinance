{% load i18n %}
<div hidden data-form-ui-strings
     data-search="{% translate 'Type to search' %}"
     data-empty="{% translate 'No matching options' %}"
     data-none="{% translate 'No option selected.' %}"
     data-selected="{% translate 'Selected:' %}"
     data-clear="{% translate 'Clear selection' %}"
