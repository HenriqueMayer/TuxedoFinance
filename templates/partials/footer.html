{% load i18n static %}
{% comment %}
Shared footer, included automatically by base.html on every screen.
{% endcomment %}
<footer class="border-t border-slate-200 dark:border-[#323232] bg-white dark:bg-[#2B2B2B]">
    <div class="mx-auto flex w-full max-w-7xl flex-col items-center gap-3 px-4 py-8 text-center sm:flex-row sm:justify-between sm:gap-4 sm:text-left sm:px-6 lg:px-8">
        <div class="flex items-center gap-2">
            <img src="{% static 'brand/tuxedo-mark-256.png' %}" alt="" class="h-7 w-7 rounded-lg">
            <span class="text-sm font-semibold text-slate-900 dark:text-white">TuxedoFinance</span>
        </div>
        <p class="text-sm text-slate-600 dark:text-neutral-400">{% translate 'Your money, in black and white.' %}</p>
        <p class="text-sm text-slate-500 dark:text-neutral-500">&copy; {% now 'Y' %} <a href="https://github.com/HenriqueMayer" target="_blank" rel="noopener noreferrer" class="hover:text-slate-900 dark:hover:text-neutral-300">HenriqueMayer</a>. {% translate 'All rights reserved.' %}</p>
    </div>
</footer>
