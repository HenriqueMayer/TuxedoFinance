{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<form action="{% url 'set_language' %}" method="post" class="inline-flex" aria-label="{% translate 'Language' %}">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path }}">
    <label class="sr-only" for="language-select-{{ selector_id|default:'default' }}">{% translate 'Language' %}</label>
    <select id="language-select-{{ selector_id|default:'default' }}" name="language" onchange="this.form.submit()"
            class="h-10 rounded-full border bg-transparent px-3 text-xs uppercase tracking-widest font-medium focus:outline-none focus:ring-2 focus:ring-caramel/40 {% if overlay %}border-cream/20 text-cream hover:bg-cream/10{% else %}border-forest/20 text-forest dark:border-cream/20 dark:text-cream{% endif %}">
        <option class="bg-white text-forest" value="en"{% if LANGUAGE_CODE == 'en' %} selected{% endif %}>EN</option>
        <option class="bg-white text-forest" value="pt-br"{% if LANGUAGE_CODE == 'pt-br' %} selected{% endif %}>PT</option>
    </select>
    <noscript><button type="submit" class="ml-1 text-xs underline">{% translate 'Apply' %}</button></noscript>
</form>
