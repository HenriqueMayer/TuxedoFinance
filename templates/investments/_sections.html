{% load i18n %}
<nav class="section-nav investment-sections" aria-label="{% translate 'Investment sections' %}">
    <a href="{% url 'investments:list' %}"{% if selected_section == 'positions' %} aria-current="page"{% endif %}>{% translate 'My investments' %}</a>
    {# The live position scope must also refresh this contextual history destination. #}
    <a id="investment-operations-link"{% if selected_section == 'positions' %} data-live-fragment="investment-position-filters"{% endif %} href="{% url 'investments:operations' %}{% if position_scope == 'cash' or position_scope == 'portfolio' %}?section={{ position_scope }}{% endif %}"{% if selected_section == 'operations' %} aria-current="page"{% endif %}>{% translate 'History' %}</a>
    <a href="{% url 'investments:prices' %}"{% if selected_section == 'prices' %} aria-current="page"{% endif %}>{% translate 'Prices' %}</a>
    <a href="{% url 'investments:settings' %}"{% if request.resolver_match.url_name == 'settings' %} aria-current="page"{% endif %}>{% translate 'Setup' %}</a>
</nav>
