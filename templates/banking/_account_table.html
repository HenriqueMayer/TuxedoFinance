{% load i18n %}
<div class="overflow-x-auto" role="region" aria-label="{% blocktranslate with bank=bank.name %}Accounts at {{ bank }}{% endblocktranslate %}" tabindex="0">
    <table class="data-table account-table" role="table">
        <colgroup><col class="w-[22%]"><col class="w-[16%]"><col class="w-[16%]"><col class="w-[16%]"><col class="w-[30%]"></colgroup>
        <thead><tr role="row"><th scope="col">{% translate 'Account' %}</th><th scope="col" class="number">{% translate 'Balance' %}</th><th scope="col" class="number">{% translate 'Set aside' %}</th><th scope="col" class="number">{% translate 'Available' %}</th><th scope="col"><span class="sr-only">{% translate 'Actions' %}</span></th></tr></thead>
        <tbody>{% for row in rows %}{% include 'banking/_account_row.html' %}{% empty %}<tr><td colspan="5" class="subtle-copy">{% translate 'No accounts included in planning.' %}</td></tr>{% endfor %}</tbody>
    </table>
</div>
