[project]
name = "tuxedo-finance"
version = "0.1.0"
description = "Tuxedo Finance — a self-hosted personal finance tracker built with Django, server-rendered and zero-JS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.7,<6.1",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
]
