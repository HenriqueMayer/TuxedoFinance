[project]
name = "tuxedo-finance"
version = "0.1.0"
description = "Tuxedo Finance — a self-hosted, server-rendered personal finance tracker built with Django and progressive enhancement."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.8,<6.1",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
]
