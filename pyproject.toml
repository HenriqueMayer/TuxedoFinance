[project]
name = "tuxedo-finance"
version = "0.6.1"
description = "Tuxedo Finance — a self-hosted, server-rendered personal finance tracker built with Django and progressive enhancement."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.8,<6.1",
    "gunicorn>=25.3,<26 ; sys_platform != 'win32'",
    "python-dotenv>=1.1,<2",
    "whitenoise>=6.12,<7",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
]
